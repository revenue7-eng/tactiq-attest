name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace

  # DDR-003 boundary F: attest-appraise must build for the browser. This job is
  # what holds the rule that p256 is used without default features there.
  wasm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build -p attest-appraise --release --target wasm32-unknown-unknown
      # attest-stop is parsed by whoever checks a device, browser included.
      - run: cargo build -p attest-stop --release --target wasm32-unknown-unknown

  # The registrar is its own workspace (tools/registrar/Cargo.toml), so
  # `cargo test --workspace` above does not reach it.
  registrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path tools/registrar/Cargo.toml
  # The stop receipt verifier is its own workspace too.
  stop-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path tools/stop-verify/Cargo.toml
