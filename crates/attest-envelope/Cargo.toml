[package]
name = "attest-envelope"
version = "0.1.0"
edition.workspace = true
description = "Canonical Custinel attestation envelope: wire format shared by prover and verifier"
publish = false
license.workspace = true

[lib]
name = "attest_envelope"
path = "src/lib.rs"

# Two dependencies, both pure computation. No I/O, no crypto verification, no
# state: this crate must stay small enough that shipping it on customer devices
# discloses nothing beyond the wire format, which the wire discloses anyway.
[dependencies]
sha2 = "0.10"
hex = "0.4"
