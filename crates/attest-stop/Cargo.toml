[package]
name = "attest-stop"
version = "0.1.0"
edition.workspace = true
description = "Body of the agent stop service's evidence sections (stop record, verifier nonce)"
license.workspace = true
publish = false

[lib]
name = "attest_stop"
path = "src/lib.rs"

# One dependency, sha2, for the digests both sides must compute the same way
# (request digest, certify qualifying data). Pure computation, builds for
# wasm32: this crate goes into the device service and into whatever checks it,
# including a browser, like attest-appraise.
[dependencies]
sha2 = "0.10"
