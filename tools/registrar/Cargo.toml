[package]
name = "registrar"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Registers a TPM attestation key against the TPM's EK certificate (DDR-005)"
publish = false

# A workspace of its own, excluded from the root one. The agent recipe in
# tactiq-os resolves the whole root workspace offline, so every crate listed in
# the root Cargo.lock has to be vendored there. The registrar needs X.509, RSA,
# AES and HMAC; none of it runs on a device, and none of it belongs in the
# agent's build inputs.
[workspace]

[[bin]]
name = "tactiq-registrar"
path = "src/main.rs"

[dependencies]
# The AK rule (DDR-004 decision 4) and the TPM name are taken from the crates
# the verifier and the agent use, so there is one rule and one name function.
attest-appraise = { path = "../../crates/attest-appraise" }
attest-envelope = { path = "../../crates/attest-envelope" }
x509-cert = { version = "0.2", default-features = false }
der = { version = "0.7", features = ["std"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
cfb-mode = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
